<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Movie Recommendations</title>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="title">OTT Movie Recommendations</div>
      <div class="tagline">Informational site: OTT upcoming, new releases, and curated picks.</div>
    </div>

    <div class="search">
      <input id="searchInput" type="search" placeholder="Search movies, genre, language..." />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="nav-left">
      <button class="tab active" data-industry="all">HOME</button>
    </div>
    <div class="nav-center">
      <button class="tab" data-industry="bollywood">BOLLYWOOD</button>
      <button class="tab" data-industry="telugu">TELUGU</button>
      <button class="tab" data-industry="tamil">TAMIL</button>
      <button class="tab" data-industry="malayalam">MALAYALAM</button>
    </div>
  </nav>

  <div class="page-shell">
    <aside class="ad-left">Ad Space<br/>300×250</aside>

    <main class="content">
      <div id="notice" class="notice"></div>

      <section class="section">
        <div class="section-head">
          <h2>Upcoming OTT</h2>
          <span id="upcomingCount" class="muted"></span>
        </div>
        <div class="carousel-container">
          <button id="upcomingPrev" class="carousel-btn carousel-btn-prev">‹</button>
          <div id="upcomingCarousel" class="carousel-track"></div>
          <button id="upcomingNext" class="carousel-btn carousel-btn-next">›</button>
        </div>
        <div id="upcomingDots" class="carousel-dots"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>New Releases OTT</h2>
          <span id="newCount" class="muted"></span>
        </div>

        <div class="carousel-container">
          <button id="newPrev" class="carousel-btn carousel-btn-prev">‹</button>
          <div id="newCarousel" class="carousel-track"></div>
          <button id="newNext" class="carousel-btn carousel-btn-next">›</button>
        </div>
        <div id="newDots" class="carousel-dots"></div>
        <div id="newPagination" class="pagination"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Best Rated</h2>
          <span id="bestCount" class="muted"></span>
        </div>

        <div class="carousel-container">
          <button id="bestPrev" class="carousel-btn carousel-btn-prev">‹</button>
          <div id="bestCarousel" class="carousel-track"></div>
          <button id="bestNext" class="carousel-btn carousel-btn-next">›</button>
        </div>
        <div id="bestDots" class="carousel-dots"></div>
        <div id="bestPagination" class="pagination"></div>
      </section>
    </main>

    <aside class="ad-right">Ad Space<br/>300×250</aside>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
